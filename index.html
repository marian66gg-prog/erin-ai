<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erin AI</title>
    <style>
        body {
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 40px;
        }
        #erin {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: #333;
            margin: 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }
        input {
            width: 80%;
            padding: 10px;
            font-size: 18px;
            border-radius: 10px;
            border: none;
        }
        button {
            margin-top: 10px;
            padding: 10px 20px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            background: #4CAF50;
            color: white;
        }
    </style>
</head>
<body>

    <h1>Erin AI</h1>
    <div id="erin">🙂</div>

    <input id="question" placeholder="Scrie aici..." />
    <button onclick="talk()">Trimite</button>

    <script>
        function talk() {
            let q = document.getElementById("question").value;
            alert("Erin răspunde: " + q);
        }
    </script>

</body>
</html>
