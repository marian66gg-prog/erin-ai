<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Erin — 3D AI</title>

<!-- three.js -->
<script src="https://cdn.jsdelivr.net/npm/three@0.154.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.154.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.154.0/examples/js/loaders/GLTFLoader.js"></script>

<style>
  html,body{height:100%;margin:0;background:#07080a;color:#e6f7f3;font-family:Inter,Arial}
  #viewport{width:100vw;height:100vh;display:block;background:#000}
  .ui {
    position: fixed; right: 12px; bottom: 12px; z-index: 30;
    width: 360px; max-width: calc(100% - 24px);
    background: rgba(2,6,10,0.66); padding:12px; border-radius:12px; backdrop-filter: blur(6px);
    box-shadow: 0 8px 30px rgba(0,0,0,0.6);
  }
  .ui .row{display:flex;gap:8px;margin-bottom:8px}
  .btn{flex:0 0 auto;background:#00b7ff;border:0;color:#002; padding:8px 12px;border-radius:8px;cursor:pointer;font-weight:700}
  .btn.secondary{background:#203040;color:#fff}
  .input{flex:1;padding:8px;border-radius:8px;border:1px solid rgba(255,255,255,0.06);background:transparent;color:inherit}
  .messages{max-height:220px;overflow:auto;padding:8px;display:flex;flex-direction:column;gap:6px}
  .msg{padding:8px;border-radius:10px;max-width:85%}
  .msg.user{align-self:flex-end;background:#06202a}
  .msg.erin{align-self:flex-start;background:#083233}
  footer{font-size:12px;color:#98a4ad;margin-top:6px}
</style>
</head>
<body>
  <div id="viewport" aria-label="3D view"></div>

  <div class="ui" role="region" aria-label="Interfață Erin">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
      <strong>Erin — asistent AI (ro-RO)</strong>
      <div style="flex:1"></div>
      <button id="fullscreenBtn" class="btn secondary">Fullscreen</button>
    </div>

    <div class="messages" id="messages"></div>

    <div class="row">
      <input id="input" class="input" placeholder="Scrie ceva..." />
      <button id="sendBtn" class="btn">Trimite</button>
    </div>

    <div class="row">
      <button id="micBtn" class="btn secondary">Vorbește (microfon)</button>
      <button id="voiceToggle" class="btn">Audio: ON</button>
      <button id="smileBtn" class="btn secondary">Gest</button>
    </div>

    <footer>Apasă "Vorbește" și dă permisiuni la microfon. Nu pune cheia OpenAI în acest fișier.</footer>
  </div>

<script>
/* =========== CONFIG =========== 
   - După ce publici backend pe Render pune aici URL-ul endpoint-ului:
   ex: const SERVER_ENDPOINT = "https://erin-backend.onrender.com/openai"
   Nu pune cheia aici!
*/
const SERVER_ENDPOINT = "REPLACE_WITH_YOUR_BACKEND_URL/openai";
const VOICE_ON = true;

/* =========== 3D (Three.js) =========== */
let scene, camera, renderer, clock, robot;
function init3D(){
  const container = document.getElementById('viewport');
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 100);
  camera.position.set(0,1.4,3.2);
  renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  container.appendChild(renderer.domElement);

  const hemi = new THREE.HemisphereLight(0xffffff, 0x111122, 0.9);
  scene.add(hemi);
  const dir = new THREE.DirectionalLight(0xffffff, 0.8); dir.position.set(5,10,7); scene.add(dir);

  // ground
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(200,200), new THREE.MeshStandardMaterial({color:0x060607,roughness:0.95}));
  ground.rotation.x = -Math.PI/2; scene.add(ground);

  // placeholder procedural head/body (if model load fails)
  robot = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.9,1.6,0.6), new THREE.MeshStandardMaterial({color:0x2c3e50}));
  body.position.y = 0; robot.add(body);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.42,32,32), new THREE.MeshStandardMaterial({color:0xf0f5f7}));
  head.position.set(0,1.1,0); robot.add(head);
  // eyes + mouth
  const eye = new THREE.SphereGeometry(0.06,16,16);
  const leftEye = new THREE.Mesh(eye,new THREE.MeshStandardMaterial({color:0x001f26})); leftEye.position.set(-0.14,1.18,0.36);
  const rightEye= leftEye.clone(); rightEye.position.set(0.14,1.18,0.36);
  robot.add(leftEye,rightEye);
  const mouth = new THREE.Mesh(new THREE.BoxGeometry(0.32,0.08,0.02), new THREE.MeshStandardMaterial({color:0x001419})); mouth.position.set(0,1.0,0.36); robot.add(mouth);

  robot.position.y = -0.6;
  scene.add(robot);

  clock = new THREE.Clock();
  window.addEventListener('resize', onResize);
  animate();
}
function onResize(){ renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); }
function animate(){
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  // idle breathe
  robot.rotation.y = 0.03 * Math.sin(t*0.6);
  robot.position.y = -0.6 + 0.02*Math.sin(t*0.9);
  renderer.render(scene,camera);
}
init3D();

/* =========== UI + Chat =========== */
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const micBtn = document.getElementById('micBtn');
const voiceToggle = document.getElementById('voiceToggle');
let voiceEnabled = VOICE_ON;

function addMessage(text, who='erin'){
  const el = document.createElement('div');
  el.className = 'msg ' + (who==='user' ? 'user' : 'erin');
  el.innerText = text;
  messagesEl.appendChild(el);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

/* =========== OpenAI call via backend =========== */
async function askServer(prompt){
  if(!SERVER_ENDPOINT || SERVER_ENDPOINT.includes('REPLACE_WITH')) {
    addMessage('Trebuie să setezi SERVER_ENDPOINT în index.html cu URL-ul backend-ului.', 'erin');
    return 'Config missing';
  }
  try{
    const r = await fetch(SERVER_ENDPOINT, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({prompt})
    });
    if(!r.ok){
      const t = await r.text();
      console.error('Server error', t);
      return 'Eroare server: ' + t.slice(0,200);
    }
    const j = await r.json();
    return j.text || j.response || (typeof j === 'string' ? j : JSON.stringify(j));
  }catch(e){
    console.error(e);
    return 'Eroare de rețea';
  }
}

async function sendPrompt(text){
  if(!text) return;
  addMessage(text,'user');
  inputEl.value = '';
  const reply = await askServer(text);
  addMessage(reply,'erin');
  if(voiceEnabled) speak(reply);
}

/* =========== TTS (browser) =========== */
function speak(txt){
  if(!('speechSynthesis' in window)) return;
  const u = new SpeechSynthesisUtterance(txt);
  u.lang = 'ro-RO';
  u.rate = 1; u.pitch = 1.03;
  u.onstart = ()=>{}; u.onend=()=>{};
  window.speechSynthesis.speak(u);
}

/* =========== Microphone (SpeechRecognition) =========== */
let recognition = null;
if('webkitSpeechRecognition' in window || 'SpeechRecognition' in window){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SR(); recognition.lang='ro-RO'; recognition.interimResults=false;
  recognition.onresult = (e)=>{ const t = e.results[0][0].transcript; sendPrompt(t); };
  recognition.onerror = (e)=> console.warn('SR error', e);
}

sendBtn.onclick = ()=> sendPrompt(inputEl.value.trim());
inputEl.addEventListener('keydown', (e)=> { if(e.key === 'Enter') sendPrompt(inputEl.value.trim()); });
voiceToggle.onclick = ()=> { voiceEnabled = !voiceEnabled; voiceToggle.innerText = 'Audio: ' + (voiceEnabled ? 'ON':'OFF'); };
document.getElementById('fullscreenBtn').onclick = async ()=> { try{ await document.documentElement.requestFullscreen(); }catch(e){ } };
micBtn.onclick = ()=> {
  if(!recognition) return alert('Microfonul nu este suportat în browserul tău.');
  recognition.start();
};
document.getElementById('smileBtn').onclick = ()=> { // quick gesture
  const orig = robot.scale.y || 1; let step=0;
  const t = setInterval(()=>{ robot.rotation.x = 0.06*Math.sin(step/3); step++; if(step>20){ clearInterval(t); robot.rotation.x = 0; } }, 40);
}

/* initial greeting */
addMessage('Salut — eu sunt Erin. Întreabă-mă orice!', 'erin');
</script>
</body>
</html>
