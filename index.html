<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Erin — 3D AI (ro-RO)</title>

<!-- Three.js -->
<script src="https://cdn.jsdelivr.net/npm/three@0.154.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.154.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.154.0/examples/js/loaders/GLTFLoader.js"></script>

<style>
  :root{
    --bg:#05060a; --card:rgba(10,14,20,0.6); --accent:#00c2ff;
  }
  html,body{height:100%;margin:0;background:var(--bg);font-family:Inter,Arial;color:#e6f7f3}
  #viewport{position:fixed;inset:0;background:#000;z-index:1}
  .ui{position:fixed;right:16px;bottom:16px;width:360px;max-width:calc(100% - 32px);z-index:30}
  .card{background:var(--card);padding:12px;border-radius:12px;backdrop-filter:blur(6px);box-shadow:0 10px 30px rgba(0,0,0,0.6)}
  .row{display:flex;gap:8px;align-items:center}
  .btn{background:var(--accent);border:none;color:#012;padding:8px 12px;border-radius:10px;cursor:pointer;font-weight:700}
  .muted{background:#2b2f33;color:#cfe;}
  .messages{max-height:240px;overflow:auto;margin:8px 0;display:flex;flex-direction:column;gap:6px}
  .msg{padding:8px;border-radius:10px;max-width:88%}
  .msg.user{align-self:flex-end;background:#042831}
  .msg.erin{align-self:flex-start;background:#073238}
  input[type="text"]{flex:1;padding:8px;border-radius:8px;border:1px solid rgba(255,255,255,0.06);background:transparent;color:inherit}
  footer.small{font-size:12px;color:#97a3ad;margin-top:6px}
</style>
</head>
<body>
  <div id="viewport" aria-hidden="false"></div>

  <div class="ui">
    <div class="card">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
        <strong>Erin — Asistent AI (română)</strong>
        <div style="flex:1"></div>
        <button id="fullscreenBtn" class="btn muted">Fullscreen</button>
      </div>

      <div class="messages" id="messages"></div>

      <div class="row" style="margin-top:8px">
        <input id="inputText" type="text" placeholder="Scrie o întrebare..." />
        <button id="sendBtn" class="btn">Trimite</button>
      </div>

      <div class="row" style="margin-top:8px">
        <button id="micBtn" class="btn muted">🎤 Vorbește</button>
        <button id="voiceToggle" class="btn">Audio: ON</button>
        <button id="gestureBtn" class="btn muted">Gest</button>
      </div>

      <footer class="small">
        Permite microfonul când ți-l cere. <br>
        <strong>ATENȚIE:</strong> dacă pui cheia OpenAI direct în acest fișier, oricine poate să o vadă.
      </footer>
    </div>
  </div>

<script>
/* =========================
   CONFIG (editează AICI dacă vrei)
   ========================= */
/* Dacă pui cheia aici, fii atent: e PUBLICĂ */
const OPENAI_KEY = "AICI_PUI_CHEIA"; // <-- înlocuiește cu cheia ta (dar recomand BACKEND!)
/* Dacă NU vrei să pui cheia frontend, folosește Web Speech API (folosit implicit pentru TTS). 
   Poți lăsa OPENAI_KEY gol și tot primești răspunsuri (dar local, fără model OpenAI). */
const USE_OPENAI = Boolean(OPENAI_KEY && OPENAI_KEY.startsWith("sk-"));
const MODEL_NAME = "gpt-4o-mini"; // modelul folosit la completări

/* =========================
   3D scene (Three.js) — avatar procedural + glTF fallback
   ========================= */
let scene, camera, renderer, clock, avatar, mouthMesh, leftEye, rightEye;
function init3D(){
  const container = document.getElementById('viewport');
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x000000);
  const w = window.innerWidth, h = window.innerHeight;
  camera = new THREE.PerspectiveCamera(40, w/h, 0.1, 1000);
  camera.position.set(0, 1.5, 3);

  renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(w,h);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  container.appendChild(renderer.domElement);

  // lights
  scene.add(new THREE.HemisphereLight(0xffffff, 0x222222, 0.5));
  const dir = new THREE.DirectionalLight(0xffffff, 1.0); dir.position.set(5,10,7); scene.add(dir);

  // ground subtle
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(200,200), new THREE.MeshStandardMaterial({color:0x050607,roughness:1}));
  ground.rotation.x = -Math.PI/2; ground.position.y = -1.1; scene.add(ground);

  // try loading a realistic glTF avatar; fallback to procedural if fails
  const loader = new THREE.GLTFLoader();
  loader.load(
    // public model (may change) — it's okay as placeholder
    "https://models.readyplayer.me/65b7f622e348f3ba7c3e1c22.glb",
    (gltf) => {
      avatar = gltf.scene;
      avatar.scale.set(1.5,1.5,1.5);
      avatar.position.set(0,-1.1,0);
      scene.add(avatar);
      // try find mouth/eyes nodes — optional
      mouthMesh = avatar.getObjectByName("Mouth") || null;
      leftEye = avatar.getObjectByName("LeftEye") || null;
      rightEye = avatar.getObjectByName("RightEye") || null;
    },
    undefined,
    (err) => {
      // fallback: procedural stylized head
      const group = new THREE.Group();
      const body = new THREE.Mesh(new THREE.BoxGeometry(0.9,1.6,0.6), new THREE.MeshStandardMaterial({color:0x1f2937}));
      body.position.y = -0.6; group.add(body);
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.45,32,32), new THREE.MeshStandardMaterial({color:0xf0f5f7}));
      head.position.set(0,0.9,0); group.add(head);
      leftEye = new THREE.Mesh(new THREE.SphereGeometry(0.06,16,16), new THREE.MeshStandardMaterial({color:0x002c33}));
      rightEye = leftEye.clone();
      leftEye.position.set(-0.14,0.95,0.36); rightEye.position.set(0.14,0.95,0.36);
      group.add(leftEye,rightEye);
      mouthMesh = new THREE.Mesh(new THREE.BoxGeometry(0.3,0.06,0.02), new THREE.MeshStandardMaterial({color:0x001419}));
      mouthMesh.position.set(0,0.78,0.36); group.add(mouthMesh);
      group.position.y = -0.9;
      avatar = group; scene.add(avatar);
    }
  );

  clock = new THREE.Clock();
  window.addEventListener('resize', onResize);
  animate();
}

function onResize(){
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth/window.innerHeight; camera.updateProjectionMatrix();
}

let blinkTimer = 0;
function animate(){
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  if (avatar){
    avatar.rotation.y = 0.03 * Math.sin(t*0.6);
    avatar.position.y = -0.9 + 0.02*Math.sin(t*0.9); // breathing
    // blink: scale eyes or modify material/emissive
    blinkTimer -= clock.getDelta();
    if (blinkTimer <= 0){
      // trigger blink occasionally
      if (Math.random() < 0.008) { doBlink(); blinkTimer = 1 + Math.random()*3; }
    }
  }
  renderer.render(scene, camera);
}

function doBlink(){
  if (!leftEye || !rightEye) return;
  // quick scale to simulate blink
  const duration = 160;
  const origScale = leftEye.scale.y;
  let step = 0;
  const iv = setInterval(()=> {
    step++;
    const v = 1 - Math.sin((step/duration)*Math.PI);
    leftEye.scale.y = Math.max(0.02, origScale * v);
    rightEye.scale.y = leftEye.scale.y;
    if (step >= duration){ clearInterval(iv); leftEye.scale.y = origScale; rightEye.scale.y = origScale; }
  }, 8);
}

/* =========================
   UI & Chat
   ========================= */
const messagesEl = document.getElementById('messages');
function addMessage(text, who='erin'){
  const d = document.createElement('div');
  d.className = 'msg ' + (who === 'user' ? 'user' : 'erin');
  d.innerText = (who === 'user' ? 'Tu: ' : 'Erin: ') + text;
  messagesEl.appendChild(d);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

/* =========================
   Speech Recognition (STT) — ro-RO
   ========================= */
let recognition = null;
try {
  const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SpeechRec){
    recognition = new SpeechRec();
    recognition.lang = 'ro-RO';
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;
    recognition.onresult = (e) => {
      const text = e.results[0][0].transcript;
      addMessage(text,'user');
      handleUserText(text);
    };
    recognition.onerror = (e) => { console.warn('SpeechRecognition error', e); };
  }
} catch(e){ recognition = null; }

/* =========================
   Text-to-Speech (browser) — ro-RO
   ========================= */
function speakBrowser(text){
  if (!('speechSynthesis' in window)) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ro-RO';
  u.rate = 1;
  u.pitch = 1.02;
  u.onstart = ()=> startMouth();
  u.onend = ()=> stopMouth();
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(u);
}

/* simplistic mouth animation while speaking */
let mouthInterval = null;
function startMouth(){
  if (!mouthMesh) return;
  clearInterval(mouthInterval);
  mouthInterval = setInterval(()=> { mouthMesh.scale.y = 0.6 + Math.random()*1.1; }, 80);
}
function stopMouth(){ if (mouthInterval) clearInterval(mouthInterval); if (mouthMesh) mouthMesh.scale.y = 1; }

/* =========================
   OpenAI call (chat) - WARNING: key in frontend is public
   ========================= */
async function callOpenAI(prompt){
  if (!USE_OPENAI) {
    // fallback local echo / simple canned responses for demo when no key provided
    return "Îmi pare, nu am cheia OpenAI. Pune cheia în cod sau folosește backend. Încă pot răspunde simplu: ai spus — " + prompt;
  }
  try {
    const res = await fetch('https://api.openai.com/v1/chat/completions', {
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'Authorization': `Bearer 
      },
      body: JSON.stringify({
        model: MODEL_NAME,
        messages: [
          {role:'system', content: 'Răspunde doar în limba română, cu ton prietenos. Tu ești Erin, un asistent adolescent, empatic.'},
          {role:'user', content: prompt}
        ],
        temperature: 0.8,
        max_tokens: 500
      })
    });
    if (!res.ok){
      const t = await res.text();
      console.error('OpenAI error', t);
      return 'Eroare la API: ' + (t.slice ? t.slice(0,200) : t);
    }
    const j = await res.json();
    const text = j?.choices?.[0]?.message?.content || (j?.choices?.[0]?.text) || JSON.stringify(j);
    return text;
  } catch(err){
    console.error(err); return 'Eroare de rețea';
  }
}

/* =========================
   Main handler: send user text -> get AI reply -> speak, animate
   ========================= */
async function handleUserText(text){
  addMessage('…', 'erin'); // thinking indicator
  const reply = await callOpenAI(text);
  // remove last 'thinking' message
  const last = messagesEl.lastElementChild;
  if (last && last.innerText.startsWith('Erin: …')) last.remove();
  addMessage(reply, 'erin');
  // speak with browser TTS
  speakBrowser(reply);
  // trigger a gesture
  doGesture();
}

/* =========================
   Buttons bindings
   ========================= */
document.getElementById('sendBtn').addEventListener('click', ()=> {
  const v = document.getElementById('inputText').value.trim();
  if(!v) return;
  addMessage(v,'user');
  handleUserText(v);
});

document.getElementById('inputText').addEventListener('keydown', (e)=> { if (e.key === 'Enter') { document.getElementById('sendBtn').click(); }});

document.getElementById('micBtn').addEventListener('click', ()=> {
  if (!recognition) return alert('Microfonul nu este suportat în browserul tău.');
  recognition.start();
});

document.getElementById('voiceToggle').addEventListener('click', ()=> {
  const b = document.getElementById('voiceToggle');
  const on = b.innerText.includes('ON');
  b.innerText = 'Audio: ' + (on ? 'OFF' : 'ON');
  // toggle by muting speechSynthesis
  if (on) window.speechSynthesis.cancel();
});

document.getElementById('gestureBtn').addEventListener('click', ()=> doGesture());
document.getElementById('fullscreenBtn').addEventListener('click', async ()=> { try { await document.documentElement.requestFullscreen(); } catch(e){} });

function doGesture(){
  if (!avatar) return;
  // head nod + arm-like rotation (if model has bones, better)
  const orig = avatar.rotation.x || 0;
  let step = 0;
  const iv = setInterval(()=> {
    step++;
    avatar.rotation.x = orig + 0.07 * Math.sin(step/3);
    if (step > 30){ clearInterval(iv); avatar.rotation.x = orig; }
  }, 30);
}

/* friendly initial message */
function initUI(){
  addMessage('Salut! Eu sunt Erin. Vorbește sau scrie în română ca să vorbim.', 'erin');
}
init3D();
initUI();

</script>
</body>
</html>
